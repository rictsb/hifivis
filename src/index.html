<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signal Path — Anatomy of a Reference Hi-Fi System</title>
<meta name="description" content="An interactive, physically-honest tour of a high-end component hi-fi system, from mains electrons to air pressure at the eardrum.">
<style>/*__FONTS__*/</style>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <div id="vignette"></div>

  <header id="masthead">
    <div class="mast-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.2">
        <path d="M1 12h3.2l2.1-7 3.3 14 3-11 2.2 8.4 1.6-4.4H23" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="mast-text">
      <h1>Signal&nbsp;Path</h1>
      <p>Anatomy of a reference hi‑fi system — mains to eardrum</p>
    </div>
  </header>

  <nav id="chapters" aria-label="Signal path stages"></nav>

  <aside id="panel" role="region" aria-live="polite">
    <div id="panel-scroll">
      <div id="panel-head">
        <span class="eyebrow"><span id="stage-index">01</span><i></i><span id="stage-kicker"></span></span>
        <h2 id="stage-title"></h2>
        <p id="stage-standfirst"></p>
      </div>
      <div id="panel-body"></div>
      <div id="panel-readouts"></div>
    </div>
  </aside>

  <div id="controls">
    <button id="prev" class="ctl" aria-label="Previous stage" title="Previous  ←">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="playpause" class="ctl wide" aria-label="Pause animation">
      <svg class="ic-pause" viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><rect x="7" y="5.5" width="3.4" height="13" rx="1"/><rect x="13.6" y="5.5" width="3.4" height="13" rx="1"/></svg>
      <svg class="ic-play" viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M8 5.6v12.8L18.5 12z"/></svg>
      <span id="rate">1×</span>
    </button>
    <button id="next" class="ctl" aria-label="Next stage" title="Next  →">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div id="scrub" role="group" aria-label="Time scale">
    <span class="scrub-lab">time scale</span>
    <div id="scrub-track"><div id="scrub-fill"></div><div id="scrub-knob"></div></div>
    <span id="scrub-val" class="mono">real time</span>
  </div>

  <div id="boot">
    <div class="boot-inner">
      <div class="boot-bar"><i></i></div>
      <span class="mono">assembling system</span>
    </div>
  </div>
  <noscript><p style="color:#ddd;font:16px system-ui;padding:2rem">This visualisation requires JavaScript and WebGL 2.</p></noscript>
</div>
<script>//__JS__</script>
</body>
</html>
